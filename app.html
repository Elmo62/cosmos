<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Reuse your existing CSS here */
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Comfortaa', cursive; color: white; }
    #ghostTrigger { position: fixed; top: 15px; right: 15px; width: 40px; height: 40px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; z-index: 10005; cursor: pointer; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; justify-content: center; opacity: 0.3; }
    #ghostTrigger:hover { opacity: 1; background: rgba(255,255,255,0.1); width: 50px; border-color: rgba(255,255,255,0.2); }
    .dot-container { display: flex; gap: 3px; }
    .dot { width: 4px; height: 4px; background: #fff; border-radius: 50%; }
    #ghostTrigger.active { opacity: 0; pointer-events: none; }
    #panel { position: fixed; top: 20px; right: -380px; width: 300px; height: calc(100% - 40px); background: rgba(10, 10, 10, 0.98); border: 1px solid rgba(255,255,255,0.08); border-radius: 35px; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; z-index: 10001; box-shadow: -20px 20px 50px rgba(0,0,0,0.9); backdrop-filter: blur(20px); box-sizing: border-box; }
    #panel.open { transform: translateX(-400px); }
    .panel-header { padding: 30px 20px 10px 20px; display: flex; justify-content: space-between; align-items: center; }
    .session-title { font-size: 1.2rem; font-weight: 700; color: #fff; margin: 0; }
    .close-btn { cursor: pointer; font-size: 0.8rem; color: #555; font-weight: 700; }
    .menu-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; flex-grow: 1; overflow-y: auto; }
    .label { color: #333; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; padding-left: 10px; }
    input { background: #151515; border: 1px solid #222; color: #fff; padding: 14px 20px; outline: none; width: 100%; box-sizing: border-box; font-size: 0.85rem; border-radius: 100px; font-family: inherit; }
    .btn { padding: 14px; background: #1a1a1a; color: white; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 700; border-radius: 100px; transition: 0.2s; font-family: inherit; text-align: center; display: block; text-decoration: none; }
    .btn:hover { background: #fff; color: #000; }
    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .setting-item { background: #151515; padding: 12px 20px; border-radius: 100px; display: flex; align-items: center; justify-content: space-between; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; border-radius: 100px; transition: .4s; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: #fff; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #fff; }
    input:checked + .slider:before { background-color: #000; transform: translateX(18px); }
    .credits-area { margin-top: auto; padding: 20px 10px; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; }
    .credits-text { font-size: 0.65rem; color: #444; }
    .author-name { font-size: 0.85rem; font-weight: 700; color: #fff; opacity: 0.8; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }
  </style>
</head>
<body>
  
  <div id="ghostTrigger" onclick="toggle()"><div class="dot-container"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>

  <div id="panel">
    <div class="panel-header">
      <h2 class="session-title">Cosmos</h2>
      <span class="close-btn" onclick="toggle()">Close Menu</span>
    </div>
    <div class="menu-body">
      <input id="navUrl" type="text" placeholder="URL...">
      <div class="control-grid">
        <button class="btn" onclick="nav()">Go</button>
        <button class="btn" onclick="location.reload()">Reload</button>
      </div>
      <div class="label">Quick Links</div>
      <div class="control-grid">
        <button class="btn" onclick="quickNav('https://web.cloudmoonapp.com/')">CloudMoon</button>
        <button class="btn" onclick="quickNav('about:blank')">Clear</button>
      </div>
      <div class="setting-item">
        <span style="font-size:0.8rem; font-weight:700;">Sandbox Fix</span>
        <label class="switch"><input type="checkbox" id="sbToggle" onchange="updSandbox()"><span class="slider"></span></label>
      </div>
      <div class="credits-area">
        <div class="credits-text">COSMOS SESSION</div>
        <div class="author-name">Made by Drake H</div>
      </div>
    </div>
    <div style="padding: 20px;">
      <button class="btn" style="width: 100%; background: #1a0505; color: #f88;" onclick="location.href='index.html'">End Session</button>
    </div>
  </div>

  <iframe id="mainFrame" src="about:blank" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>

  <script>
    // 1. Initial Load Logic
    const params = new URLSearchParams(window.location.search);
    const initialUrl = params.get('url');
    const frame = document.getElementById('mainFrame');
    const navInput = document.getElementById('navUrl');

    if (initialUrl) {
      frame.src = initialUrl;
      navInput.value = initialUrl;
    }

    // 2. Control Functions
    function toggle() { 
      document.getElementById('panel').classList.toggle('open'); 
      document.getElementById('ghostTrigger').classList.toggle('active');
    }

    function nav() {
      let u = navInput.value.trim();
      if (u) {
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
        frame.src = u;
        toggle();
      }
    }

    function quickNav(target) {
      frame.src = target;
      navInput.value = target;
      toggle();
    }

    function updSandbox() {
      const blockEnabled = document.getElementById('sbToggle').checked;
      const currentSrc = frame.src;
      frame.setAttribute('sandbox', blockEnabled ? 
        'allow-forms allow-scripts allow-same-origin' : 
        'allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');
      frame.src = currentSrc;
    }

    navInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') nav(); });
  </script>
</body>
</html>
