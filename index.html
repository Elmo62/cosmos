<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmos | Launch</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #000000; --pill: #1a1a1a; --white: #ffffff; }
    body {
      background: var(--bg); color: var(--white);
      font-family: 'Comfortaa', cursive;
      display: flex; flex-direction: column; justify-content: center;
      align-items: center; height: 100vh; margin: 0; overflow: hidden;
    }
    .main-ui { text-align: center; }
    h1 { font-weight: 700; letter-spacing: -2px; margin-bottom: 2rem; font-size: 4rem; opacity: 0.9; }
    .main-input {
      background: var(--pill); border: 2px solid #222; padding: 1.2rem 2.5rem;
      color: #fff; width: 420px; outline: none; border-radius: 100px;
      transition: all 0.4s ease; text-align: center; font-size: 1rem;
    }
    .main-input:focus { border-color: #444; }
    .launch-btn {
      margin-top: 2rem; background: var(--white); color: #000; border: none;
      padding: 1.2rem 4rem; cursor: pointer; font-weight: 700;
      border-radius: 100px; transition: 0.3s;
    }
    .launch-btn:hover { transform: scale(1.05); background: #eee; }
    .status { margin-top: 15px; font-size: 0.8rem; color: #444; }
  </style>
</head>
<body>

  <div class="main-ui">
    <h1>Cosmos</h1>
    <input id="pageInput" class="main-input" type="text" placeholder="destination..." spellcheck="false">
    <br>
    <button class="launch-btn" onclick="openSession();">Open Popup</button>
    <div class="status" id="statusMsg">If popup is blocked, check your address bar.</div>
  </div>

  <script>
    function openSession() {
      const input = document.getElementById('pageInput');
      let url = input.value.trim();
      
      if (!url) { input.style.borderColor = "#f00"; return; }
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      const popup = window.open('about:blank', 'CosmosSession', 'width=1280,height=720');

      if (!popup || popup.closed || typeof popup.closed == 'undefined') {
          document.getElementById('statusMsg').innerText = "❌ Popup Blocked!";
          return;
      }

      popup.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Cosmos Session</title>
          <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
          <style>
            body, html { margin:0; padding:0; height:100%; overflow:hidden; background:#000; font-family:'Comfortaa', cursive; color:white; }
            iframe { width:100%; height:100%; border:none; background:#fff; }
            
            /* Controls */
            #ghostTrigger { 
                position:fixed; top:15px; right:15px; width:40px; height:40px; 
                background:rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
                border-radius:12px; z-index:10005; cursor:pointer; 
                display:flex; align-items:center; justify-content:center; 
                transition:0.3s; opacity:0.4; 
            }
            #ghostTrigger:hover { opacity:1; background:rgba(255,255,255,0.15); }
            .dot { width:4px; height:4px; background:#fff; border-radius:50%; margin:0 1px; }

            /* Navigation Panel */
            #panel { 
                position:fixed; top:20px; right:-380px; width:300px; 
                height:calc(100% - 40px); background:rgba(10,10,10,0.98); 
                border:1px solid rgba(255,255,255,0.1); border-radius:30px; 
                transition:0.6s cubic-bezier(0.16,1,0.3,1); z-index:10001; 
                padding:25px; box-sizing:border-box; display:flex; flex-direction:column;
                backdrop-filter: blur(10px);
            }
            #panel.open { transform: translateX(-400px); }

            /* Hidden Debug Button */
            #debugTrigger {
                position: fixed; bottom: 5px; left: 5px; width: 20px; height: 20px;
                background: rgba(255,255,255,0.02); z-index: 10006; cursor: crosshair;
                border-radius: 4px; transition: 0.3s;
            }
            #debugTrigger:hover { background: rgba(255,255,255,0.1); }

            /* Debug Overlay */
            #debugOverlay {
                position: fixed; bottom: 30px; left: 10px; width: 280px;
                background: rgba(0,0,0,0.9); border: 1px solid #333;
                border-radius: 12px; padding: 15px; font-size: 10px; font-family: monospace;
                display: none; z-index: 10007; color: #0f0; pointer-events: none;
            }

            input { background:#151515; border:1px solid #222; color:#fff; padding:12px 20px; border-radius:100px; outline:none; width:100%; box-sizing:border-box; margin-bottom:10px; }
            .btn { padding:12px; background:#1a1a1a; color:#fff; border:none; border-radius:100px; cursor:pointer; font-weight:700; width:100%; margin-bottom:10px; transition: 0.2s; }
            .btn:hover { background:#fff; color:#000; }
            .label { font-size:0.7rem; color:#444; text-transform:uppercase; margin:10px 0 5px 10px; }
          </style>
        </head>
        <body>
          <!-- UI Elements -->
          <div id="ghostTrigger" onclick="t()">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          </div>

          <div id="debugTrigger" onclick="toggleDebug()"></div>
          <div id="debugOverlay" id="dbg">
            [SYSTEM LOG]<br>
            URL: <span id="log-url"></span><br>
            SANDBOX: <span id="log-sbx"></span><br>
            SESSION: <span id="log-time"></span>
          </div>

          <div id="panel">
            <div style="font-weight:700; font-size:1.2rem; margin-bottom:20px;">Cosmos</div>
            <input id="n" type="text" value="${url}">
            <button class="btn" onclick="g()">Navigate</button>
            <button class="btn" onclick="r()">Reload</button>
            <div class="label">Quick Links</div>
            <button class="btn" onclick="q('https://web.cloudmoonapp.com/')">CloudMoon</button>
            <div class="label">Settings</div>
            <button id="fixBtn" class="btn" onclick="toggleFix()">CloudMoon Fix: ON</button>
            <div style="margin-top:auto;">
               <button class="btn" style="background:#200; color:#f55;" onclick="window.close()">Close Session</button>
            </div>
          </div>

          <iframe id="f" src="${url}" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>

          <script>
            const f = document.getElementById('f');
            const p = document.getElementById('panel');
            const n = document.getElementById('n');
            const fixBtn = document.getElementById('fixBtn');
            const debugBox = document.getElementById('debugOverlay');
            
            let fixEnabled = true;

            function t() { p.classList.toggle('open'); }
            
            function updateLogs() {
                document.getElementById('log-url').innerText = f.src;
                document.getElementById('log-sbx').innerText = f.getAttribute('sandbox');
                document.getElementById('log-time').innerText = new Date().toLocaleTimeString();
            }

            function g() { 
                let u = n.value; 
                if(!/^https?:\\/\\//i.test(u)) u = 'https://' + u;
                f.src = u; 
                t(); 
                updateLogs();
            }

            function r() { 
                const c = f.src; 
                f.src = 'about:blank'; 
                setTimeout(() => { f.src = c; updateLogs(); }, 50); 
                if(p.classList.contains('open')) t(); 
            }

            function q(u) { f.src = u; n.value = u; t(); updateLogs(); }

            function toggleFix() {
                fixEnabled = !fixEnabled;
                if (fixEnabled) {
                    f.setAttribute('sandbox', 'allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');
                    fixBtn.innerText = "CloudMoon Fix: ON";
                } else {
                    f.setAttribute('sandbox', 'allow-forms allow-scripts allow-same-origin');
                    fixBtn.innerText = "CloudMoon Fix: OFF";
                }
                r();
            }

            function toggleDebug() {
                debugBox.style.display = debugBox.style.display === 'block' ? 'none' : 'block';
                updateLogs();
            }
            
            n.addEventListener('keypress', (e) => { if(e.key === 'Enter') g(); });
            
            // Initial log state
            updateLogs();
          <\/script>
        </body>
        </html>
      `);
      popup.document.close();
    }

    document.getElementById('pageInput').addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') openSession(); 
    });
  </script>
</body>
</html>
