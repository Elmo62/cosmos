<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --panel: #0d0d0d; --white: #ffffff; --pill: #1a1a1a; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: var(--white);
            font-family: 'Comfortaa', cursive; overflow: hidden;
        }

        /* --- LANDING UI --- */
        #landing-view {
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; height: 100vh; text-align: center;
        }
        h1 { font-weight: 700; letter-spacing: -2px; margin-bottom: 2rem; font-size: 4rem; opacity: 0.9; }
        .main-input {
            background: var(--pill); border: 2px solid #222; padding: 1.2rem 2.5rem;
            color: #fff; width: 420px; max-width: 80%; outline: none; border-radius: 100px;
            transition: all 0.4s ease; text-align: center; font-size: 1rem;
        }
        .main-input:focus { border-color: #444; }
        .launch-btn {
            margin-top: 2rem; background: var(--white); color: #000; border: none;
            padding: 1.2rem 4rem; cursor: pointer; font-weight: 700;
            border-radius: 100px; transition: 0.3s;
        }
        .launch-btn:hover { transform: scale(1.05); }

        /* --- APP UI --- */
        #app-view { display: none; height: 100vh; width: 100vw; position: relative; }
        
        #mainFrame { width: 100%; height: 100%; border: none; background: #fff; }

        #ghostTrigger {
            position: fixed; top: 15px; right: 15px; width: 40px; height: 40px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; z-index: 10005; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; opacity: 0.5;
        }
        #ghostTrigger:hover { opacity: 1; background: rgba(255,255,255,0.15); }
        .dot-container { display: flex; gap: 3px; }
        .dot { width: 4px; height: 4px; background: #fff; border-radius: 50%; }

        #panel {
            position: fixed; top: 20px; right: -350px; width: 300px;
            height: calc(100% - 40px); background: rgba(10, 10, 10, 0.95);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 30px;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10001; backdrop-filter: blur(20px);
            display: flex; flex-direction: column; padding: 25px; box-sizing: border-box;
        }
        #panel.open { transform: translateX(-370px); }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { cursor: pointer; font-size: 0.8rem; opacity: 0.5; }

        .menu-body { display: flex; flex-direction: column; gap: 15px; flex-grow: 1; }
        .nav-input { 
            background: #151515; border: 1px solid #222; color: #fff; 
            padding: 12px 20px; border-radius: 100px; outline: none; font-family: inherit;
        }
        .btn { 
            padding: 12px; background: #1a1a1a; color: #fff; border: none; 
            border-radius: 100px; cursor: pointer; font-weight: 700; font-family: inherit;
            transition: 0.2s; text-align: center;
        }
        .btn:hover { background: #fff; color: #000; }
        
        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .label { font-size: 0.7rem; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }

        .setting-item {
            background: #151515; padding: 10px 15px; border-radius: 100px;
            display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem;
        }

        /* Toggle Switch */
        .switch { position: relative; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 20px; transition: 0.4s; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; transition: 0.4s; border-radius: 50%; }
        input:checked + .slider { background: #fff; }
        input:checked + .slider:before { background: #000; transform: translateX(14px); }
    </style>
</head>
<body>

    <div id="landing-view">
        <h1>Cosmos</h1>
        <input id="urlInput" class="main-input" type="text" placeholder="destination..." spellcheck="false">
        <button class="launch-btn" onclick="launch()">Launch</button>
    </div>

    <div id="app-view">
        <div id="ghostTrigger" onclick="togglePanel()">
            <div class="dot-container"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>

        <div id="panel">
            <div class="panel-header">
                <span style="font-weight:700">Cosmos</span>
                <span class="close-btn" onclick="togglePanel()">CLOSE</span>
            </div>
            
            <div class="menu-body">
                <input id="navInput" class="nav-input" type="text" placeholder="URL...">
                <div class="control-grid">
                    <button class="btn" onclick="nav()">Go</button>
                    <button class="btn" onclick="reloadFrame()">Reload</button>
                </div>

                <div class="label">Quick Links</div>
                <div class="control-grid">
                    <button class="btn" onclick="quickNav('https://web.cloudmoonapp.com/')">CloudMoon</button>
                    <button class="btn" onclick="quickNav('about:blank')">Clear</button>
                </div>

                <div class="setting-item">
                    <span>Sandbox Fix</span>
                    <label class="switch">
                        <input type="checkbox" id="sbToggle" onchange="updateSandbox()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <button class="btn" style="background:#200; color:#f55; margin-top:20px;" onclick="exitSession()">Exit Session</button>
        </div>

        <iframe id="mainFrame" src="about:blank" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>

    <script>
        const landing = document.getElementById('landing-view');
        const app = document.getElementById('app-view');
        const frame = document.getElementById('mainFrame');
        const navInput = document.getElementById('navInput');
        const panel = document.getElementById('panel');

        function launch() {
            let u = document.getElementById('urlInput').value.trim();
            if (!u) return;
            if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
            
            landing.style.display = 'none';
            app.style.display = 'block';
            frame.src = u;
            navInput.value = u;
        }

        function togglePanel() {
            panel.classList.toggle('open');
        }

        function nav() {
            let u = navInput.value.trim();
            if (u) {
                if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
                frame.src = u;
                togglePanel();
            }
        }

        function quickNav(u) {
            frame.src = u;
            navInput.value = u;
            togglePanel();
        }

        function reloadFrame() {
            const current = frame.src;
            frame.src = 'about:blank';
            setTimeout(() => { frame.src = current; }, 50);
            togglePanel();
        }

        function updateSandbox() {
            const active = document.getElementById('sbToggle').checked;
            const current = frame.src;
            // CloudMoon Fix: Remove popups if toggled
            frame.setAttribute('sandbox', active ? 
                'allow-forms allow-scripts allow-same-origin' : 
                'allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');
            frame.src = current;
        }

        function exitSession() {
            app.style.display = 'none';
            landing.style.display = 'flex';
            frame.src = 'about:blank';
        }

        // Enter Key Support
        document.getElementById('urlInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') launch(); });
        navInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') nav(); });
    </script>
</body>
</html>
